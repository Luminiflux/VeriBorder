mod_description=VeriBorder is a fully bilingual (English/Chinese) document and border-control system for Minecraft 1.20.1 Forge. It reproduces identity cards, passports, permits, visas, endorsements and immigration stamps, plus airport, border, hotel and government terminals. All document data lives in item NBT and every document, cover colour and document type can be freely customised.
